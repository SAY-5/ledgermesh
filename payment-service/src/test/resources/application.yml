spring:
  datasource:
    url: jdbc:h2:mem:payments;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  kafka:
    bootstrap-servers: localhost:1
    admin:
      auto-create: false
    listener:
      auto-startup: false

ledgermesh:
  outbox:
    enabled: false
  payment:
    sweeper: false
    sweep-grace: 0s
    retry-delay: 0s
  processor:
    transient-percent: 5
    slow-percent: 1
    slow-millis: 3000

resilience4j:
  retry:
    instances:
      processor:
        max-attempts: 3
        wait-duration: 10ms
        retry-exceptions:
          - io.ledgermesh.payment.processor.ProcessorUnavailableException
          - java.util.concurrent.TimeoutException
  circuitbreaker:
    instances:
      processor:
        sliding-window-size: 10
        minimum-number-of-calls: 6
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        automatic-transition-from-open-to-half-open-enabled: false
  timelimiter:
    instances:
      processor:
        timeout-duration: 300ms
        cancel-running-future: true
