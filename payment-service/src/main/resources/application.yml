server:
  port: ${PORT:8083}
  shutdown: graceful

spring:
  application:
    name: payment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payments}
    username: ${DB_USER:ledgermesh}
    password: ${DB_PASSWORD:ledgermesh}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:19092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 30000
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        max.poll.interval.ms: 300000
        session.timeout.ms: 10000
    listener:
      ack-mode: record
      concurrency: 3
  lifecycle:
    timeout-per-shutdown-phase: 10s

ledgermesh:
  processor:
    limit: 10000
    transient-percent: ${PROCESSOR_TRANSIENT_PERCENT:5}
    slow-percent: ${PROCESSOR_SLOW_PERCENT:1}
    slow-millis: 3000
  payment:
    sweep-grace: 3s
    sweep-ms: 1000
    retry-delay: 2s
  outbox:
    poll-ms: 200
  dlq:
    max-attempts: 8
    max-replays: 3

resilience4j:
  retry:
    instances:
      processor:
        max-attempts: 3
        wait-duration: 200ms
        retry-exceptions:
          - io.ledgermesh.payment.processor.ProcessorUnavailableException
          - java.util.concurrent.TimeoutException
  circuitbreaker:
    instances:
      processor:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 60
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
        allow-health-indicator-to-fail: false
        ignore-exceptions: []
  timelimiter:
    instances:
      processor:
        timeout-duration: 1s
        cancel-running-future: true
      processor-deferred:
        timeout-duration: 5s
        cancel-running-future: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,retries
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
  metrics:
    tags:
      service: payment-service

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
