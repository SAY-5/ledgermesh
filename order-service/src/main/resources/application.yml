server:
  port: ${PORT:8081}
  shutdown: graceful

spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${DB_USER:ledgermesh}
    password: ${DB_PASSWORD:ledgermesh}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:19092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 30000
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        max.poll.interval.ms: 300000
        session.timeout.ms: 10000
    listener:
      ack-mode: record
      concurrency: 3
  lifecycle:
    timeout-per-shutdown-phase: 10s

ledgermesh:
  inventory:
    url: ${INVENTORY_URL:http://localhost:8082}
  saga:
    reservation: ${SAGA_RESERVATION_TIMEOUT:60s}
    payment: ${SAGA_PAYMENT_TIMEOUT:120s}
    max-redrives: 1
    reaper-ms: 5000
  outbox:
    poll-ms: 200
  dlq:
    max-attempts: 8

resilience4j:
  circuitbreaker:
    instances:
      inventory:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 4
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
        allow-health-indicator-to-fail: false
  timelimiter:
    instances:
      inventory:
        timeout-duration: 800ms
        cancel-running-future: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
  metrics:
    tags:
      service: order-service

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
