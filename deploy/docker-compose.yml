name: ledgermesh

x-service: &service
  restart: "no"
  environment: &service-env
    KAFKA_BOOTSTRAP: redpanda:9092
    DB_USER: ledgermesh
    DB_PASSWORD: ledgermesh
  depends_on:
    redpanda:
      condition: service_healthy
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  redpanda:
    image: redpandadata/redpanda:v24.3.18
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 512M
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info -X brokers=localhost:9092 >/dev/null 2>&1"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ledgermesh
      POSTGRES_PASSWORD: ledgermesh
      POSTGRES_DB: ledgermesh
    volumes:
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgermesh -d payments"]
      interval: 3s
      timeout: 3s
      retries: 20

  order-service:
    <<: *service
    build:
      context: ..
      dockerfile: order-service/Dockerfile
    image: ledgermesh/order-service:local
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/orders
      INVENTORY_URL: http://inventory-service:8082
    ports:
      - "8081:8081"

  inventory-service:
    <<: *service
    build:
      context: ..
      dockerfile: inventory-service/Dockerfile
    image: ledgermesh/inventory-service:local
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/inventory
      REDIS_HOST: redis
    ports:
      - "8082:8082"

  payment-service:
    <<: *service
    build:
      context: ..
      dockerfile: payment-service/Dockerfile
    image: ledgermesh/payment-service:local
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/payments
    ports:
      - "8083:8083"
