name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B --no-transfer-progress verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: "**/target/*-reports/*.xml"

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [order-service, inventory-service, payment-service]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: false
          tags: ledgermesh/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chaos:
    needs: test
    runs-on: ubuntu-latest
    env:
      # a ceiling, not an expected value: see the chaos section of the README
      CHAOS_MAX_P95: "90000"
    steps:
      - uses: actions/checkout@v4
      - run: make chaos
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chaos-report
          path: chaos/out/

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          # the measured check reads the commit that introduced each summary's bytes from history
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # the generated files must still match the services' configuration and the recorded runs
      - run: npm run config:check
      - run: npm run measured:check
      - run: npm run build
      - run: npm run selfcheck
